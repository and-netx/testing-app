# Catalogo de modelos NO-CHAT gratuitos  (SEMILLA - lo que baja cada instalacion)
# ==================================================================
#   URL: https://raw.githubusercontent.com/and-netx/testing-app/main/modelos-otros.yaml
#
# Es el hermano de modelos.yaml: ahi van los modelos que ATIENDEN CHAT (y con eso el
# gateway arma su cantera de escalones). Aca van los que NO conversan: transcripcion,
# voz, embeddings, rerank, OCR, musica, datos. Sale del relevamiento del 15/09/26.
#
# POR QUE UN ARCHIVO APARTE
#  - Ninguno de estos puede ser escalon del gateway: no aceptan una conversacion.
#    Pedirle chat a un modelo de musica devuelve 502 (paso con Lyria, ver no_usar).
#  - Aca SOLO entra lo gratuito. Si se paga, no va: va a no_usar o al historico.
#
# REGLAS (mismas que modelos.yaml donde aplican)
#  - NO lleva claves: solo el NOMBRE de la variable de entorno (api_key_env).
#  - herramientas/vision: ningun modelo de aca hace tool-calling -> tools: false.
#    vision: true solo si ACEPTA imagen de entrada (OCR, documentos, letra desde foto).
#  - costo_estado: gratis | desconocido. Nunca un 0.0 ambiguo.
#  - class 'local'  = pesos abiertos: corre en la maquina, sin cuota, sin red, sin key.
#    class 'api_free' = free tier de un proveedor: tiene limite y hay que respetarlo.
#  - params / peso_fp16_gb: los parametros los informa la API de HuggingFace; el peso en
#    GB es DERIVADO (2 bytes por parametro en fp16) y es null cuando no hay dato.
#  - acceso: abierto | aceptar_terminos_hf (el repo exige aceptar condiciones en HF).
#  - estado_free: verificado (llamada real OK) | sin_verificar (lo dice la doc) |
#    sin_key (no hay credencial propia para probarlo) | bloqueado_terminos |
#    bloqueado_credencial (existe la credencial pero esta vencida/mal).
#  - unidad_cobro = en que unidad cobra el proveedor cuando se agota el free tier.
#
# OJO CON LAS LICENCIAS: varios modelos gratis traen licencia NO comercial
#   (cc-by-nc: musicgen, jina-reranker-v3, hubert-ecg) o con condiciones
#   (CPML en xtts-v2). Gratis != vendible.
#
# HISTORICO: altas, bajas y descartes de este catalogo van a modelos-historico-otros.yaml.
# ==================================================================

semilla: 1
actualizado: "2026-09-15 11:22"
origen: "relevamiento del universo de modelos no-chat del 15/09/26 (catalogos de OpenRouter, Vertex/Gemini, OpenAI, Mistral, Cohere, Voyage, Jina, ElevenLabs, Deepgram, Groq, Cloudflare Workers AI, NVIDIA NIM y la taxonomia de tareas de HuggingFace)"
alcance: "solo gratuitos: pesos abiertos que corren local, y free tiers de API. Nada que exija tarjeta entra en 'modelos'."
ultima_revision: "2026-09-15: alta inicial. 47 modelos locales (metadata leida de la API de HF), 35 entradas de free tier, 5 trampas en no_usar. Numeros de gratuitidad leidos de la doc de cada proveedor; 3 endpoints probados con llamada real (Groq whisper OK, Mistral embed OK, Gemini 401 por credencial vencida)."
