  mistral: "https://docs.mistral.ai/getting-started/models/ (plan gratuito de La Plateforme)"
  gemini: "https://ai.google.dev/gemini-api/docs/pricing (columna Free Tier: 'Free of charge')"
  cloudflare: "https://developers.cloudflare.com/workers-ai/platform/pricing/ (free allocation)"
  voyage: "https://docs.voyageai.com/docs/pricing (200 millones de tokens por modelo)"
  elevenlabs: https://elevenlabs.io/docs/models
  deepgram: https://developers.deepgram.com/docs/models-languages-overview
  cohere: https://docs.cohere.com/docs/models
  jina: https://jina.ai/embeddings/
  huggingface: https://huggingface.co/docs/inference-providers/pricing
