notas:
  tesseract: "El OCR basico ya esta instalado en esta maquina (/usr/bin/tesseract), igual que ffmpeg."
  credencial_gemini: "La GEMINI_API_KEY de ~/.hermes/.env es un token efimero vencido (13 caracteres, empieza 'AQ.A'), no una API key de AI Studio ('AIza...', ~39). Por eso los 6 modelos de Google de este archivo quedan en estado bloqueado_credencial."
  duplicado_en_modelos_yaml: "openrouter-google-lyria-3-pro-preview figura en modelos.yaml como 'gratis' (el catalogo lo lista con in=0 out=0). Es un error de origen: ver no_usar en este archivo."
  local_vs_api: "Todo lo que dice 'local' no necesita red ni credencial: es la parte del catalogo que no se puede caer ni cobrar."
