# Catalogo de modelos del gateway LLM  (SEMILLA - lo que baja cada instalacion)
# ==================================================================
#   URL: https://raw.githubusercontent.com/and-netx/testing-app/main/modelos.yaml
#
# Este archivo es el ORIGEN DE MODELOS: cada gateway lo baja de aca y con eso
# arma su cantera de candidatos. Actualizarlo = todos los gateways al dia.
#
# REGLAS
#  - NO lleva claves: solo el NOMBRE de la variable de entorno (api_key_env).
#  - ventana_tokens    = cuantos tokens de ENTRADA acepta el modelo (su contexto).
#  - apto_hasta_tokens = hasta cuantos tokens le mandamos nosotros (< ventana).
#  - tools / vision    = capacidades, en booleano. NULL = sin verificar, y para
#    trafico de AGENTE un null es false (fail-closed): un escalon sin tools deja
#    al agente chat-only aunque responda.
#  - costo_estado      = gratis | pago | desconocido. Nunca un 0.0 ambiguo: con
#    precio desconocido el gateway NO calcula dinero, corta por tokens.
#  - costo_*_millon    = USD por 1M tokens. Si el proveedor cobra por hora, estos
#    son la tarifa VALLE y los "..._pico" la pico (ver horario_pico).
#  - `no_usar`         = lo que el gateway NO debe ofrecer: modelos muertos y
#    trampas (parecen gratis y no lo son). Solo lo DEFINITIVO: lo que puede
#    volver (saturado / restringido) vive en modelos-historico.yaml con su plazo.
#
# HISTORICO: el registro completo de altas, bajas y descartes esta al lado, en
#   modelos-historico.yaml  (lo mantiene el barrido; el gateway no lo baja).
# ==================================================================

semilla: 1
actualizado: 2026-09-15 11:35
barrido: "79 modelos probados el 10/09, 27 utiles (+ deepseek-flash, agregado a mano: es el unico pago)"
ultima_revision: "2026-09-15: 27 modelos de la semilla y 7 candidatos nuevos probados con una llamada real cada uno -> 2 altas (gemma-4 26b y 31b), 2 bajas (groq qwen3.6-27b, bai glm-5.3-flash), 2 lentisimos (nemotron lightning/ultra) y 4 candidatos descartados (ver 'descartados'). 11:35: 1 baja mas (openrouter google/lyria-3-pro-preview: es de musica, no de chat, y pide saldo -> pasa a no_usar) y nace el catalogo no-chat modelos-otros.yaml con 85 gratuitos (44 locales + 41 de free tier) y 5 trampas"
costos_verificados: 2026-09-14
capacidades_verificadas: "2026-09-15 (revision de altas y bajas)"

# De donde salio cada precio (lo que DECLARA el proveedor).
fuentes_costo:
  groq: "tier free de Groq (https://api.groq.com/openai/v1): los 7 listados son de la capa gratis"
  openrouter: "catalogo publico (https://openrouter.ai/api/v1/models): los 16 ids listados informan in=0 out=0"
  bai: "https://api.b.ai/ no publica tarifas (401 en /v1/models, 403 en /pricing): SIN VERIFICAR"
  deepseek: "https://api-docs.deepseek.com/quick_start/pricing"

# De donde salieron tools / vision.
fuentes_capacidades:
  groq: "ficha de cada modelo en https://console.groq.com/docs/model/<id> (campo CAPABILITIES)"
  openrouter: "catalogo publico https://openrouter.ai/api/v1/models (supported_parameters trae 'tools'; architecture.input_modalities trae 'image')"
  deepseek: "https://api-docs.deepseek.com/quick_start/pricing (Tool Calls y Vision marcados)"
  bai: "sin datos publicos: tools/vision quedan en null"
  groq/compound: "la ficha del modelo devuelve 404: es un sistema agentico con herramientas del lado de Groq, no se pudo verificar que acepte tools del cliente"

proveedores:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  bai:
    base_url: https://api.b.ai/v1
    api_key_env: BAI_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

# NO USAR: muertos y trampas. No se ofrecen, no se prueban: no gastes cuota en ellos.
no_usar:
  - name: groq-qwen-qwen3-6-27b
    proveedor: groq
    model: qwen/qwen3.6-27b
    ts: "2026-09-15 10:11"
    motivo: "HTTP 404 'The model qwen/qwen3.6-27b does not exist or you do not have access': Groq lo saco de su catalogo"
    reintentable: false
  - name: bai-glm-5-3-flash
    proveedor: bai
    model: glm-5.3-flash
    ts: "2026-09-15 10:11"
    motivo: "HTTP 400 'credit insufficient balance: balance=0 required=102' con la key del GATEWAY: no es gratis, exige saldo. Los otros 3 de bai si responden a costo 0"
    reintentable: false
  - name: openrouter-google-lyria-3-pro-preview
    proveedor: openrouter
    model: google/lyria-3-pro-preview
    ts: "2026-09-15 11:30"
    motivo: "TRAMPA del catalogo: OpenRouter lo lista sin precio (in=0 out=0) y parece gratis, pero es un modelo de MUSICA. Pedirle audio devuelve HTTP 402 'requires at least $0.50 in balance for audio output' y pedirle chat devuelve HTTP 502 (500 interno de Google AI Studio). Estaba en 'modelos' y como escalon le devolvia el 502 al cliente"
    reintentable: false
    nota: "Su lugar es el catalogo no-chat (modelos-otros.yaml -> no_usar). Detalle en modelos-historico.yaml"

