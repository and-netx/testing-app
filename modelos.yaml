# Semilla de modelos del gateway LLM
# ==================================================================
# Este archivo es el ORIGEN DE MODELOS: cada instalacion del gateway lo
# baja desde aca y con eso arma su cantera de candidatos.
#   URL: https://raw.githubusercontent.com/and-netx/testing-app/main/modelos.yaml
# Actualizarlo = todos los gateways al dia (sin tocar ninguna maquina).
#
# REGLAS
#  - NO lleva claves: solo el NOMBRE de la variable de entorno (api_key_env).
#  - ventana_tokens   = cuantos tokens de ENTRADA acepta el modelo (su contexto).
#  - apto_hasta_tokens = hasta cuantos tokens le mandamos nosotros (< ventana).
#  - tools / vision = CAPACIDADES de entrada/salida del modelo, en booleano.
#      tools:  true  = acepta herramientas (function calling / tool use)
#      vision: true  = acepta imagenes como ENTRADA
#      null = sin verificar. Para trafico de AGENTE un null NO se usa: se trata
#             como false (fail-closed), porque un escalon sin tools deja al
#             agente chat-only aunque responda (paso el 13/09 con el local).
#  - costo_in_millon / costo_out_millon = USD por 1M tokens de ENTRADA y de SALIDA.
#    Si el proveedor cobra distinto segun la hora, esos dos campos son la tarifa
#    VALLE y los "..._pico" la tarifa pico (ver deepseek-flash y su horario_pico).
#  - costo_estado: gratis | pago | desconocido. Nunca un 0.0 ambiguo: si el precio
#    no se verifico va "desconocido" y los montos en null (con precio desconocido
#    el gateway no calcula dinero: corta por tokens).
#  - Un modelo que no este aca no se ofrece; uno que este, igual tiene que andar
#    en la maquina del cliente: la verdad la fija su medicion local.
#
# CAMPOS por modelo: name, proveedor, model, tools, vision, ventana_tokens,
#                    apto_hasta_tokens, timeout_s, latencia_s (medida),
#                    verificado_ts, costo_estado, costo_in_millon, costo_out_millon
#   y ademas, solo en los que cobran por hora: costo_in_millon_pico,
#                    costo_out_millon_pico, costo_cache_in_millon,
#                    costo_cache_in_millon_pico, horario_pico, fuente_costo
# ==================================================================

semilla: 1
actualizado: 2026-09-10 18:53
barrido: '79 modelos probados, 27 utiles (+ deepseek-flash, agregado a mano: es el unico pago)'
costos_verificados: 2026-09-14
capacidades_verificadas: 2026-09-14

# De donde salio cada precio (lo que DECLARA el proveedor).
fuentes_costo:
  groq: "tier free de Groq (https://api.groq.com/openai/v1): los 7 listados son de la capa gratis"
  openrouter: "catalogo publico (https://openrouter.ai/api/v1/models): los 16 ids listados informan in=0 out=0"
  bai: "https://api.b.ai/ no publica tarifas (401 en /v1/models, 403 en /pricing): SIN VERIFICAR"
  deepseek: "https://api-docs.deepseek.com/quick_start/pricing"

# De donde salieron tools / vision.
fuentes_capacidades:
  groq: "ficha de cada modelo en https://console.groq.com/docs/model/<id> (campo CAPABILITIES)"
  openrouter: "catalogo publico https://openrouter.ai/api/v1/models (supported_parameters trae 'tools'; architecture.input_modalities trae 'image')"
  deepseek: "https://api-docs.deepseek.com/quick_start/pricing (Tool Calls y Vision marcados)"
  bai: "sin datos publicos: tools/vision quedan en null"
  groq/compound: "la ficha del modelo devuelve 404: es un sistema agentico con herramientas del lado de Groq, no se pudo verificar que acepte tools del cliente"

proveedores:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
  bai:
    base_url: https://api.b.ai/v1
    api_key_env: BAI_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

