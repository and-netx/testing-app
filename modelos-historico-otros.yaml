# Historico del catalogo de modelos NO-CHAT (el hermano de modelos-otros.yaml)
# ==================================================================
# El registro que CRECE: cada alta, cada baja, cada descarte y cada bloqueo, con
# su motivo, su fecha y si puede volver. NO lo baja nadie (el catalogo vivo esta
# en modelos-otros.yaml): esto es para el mantenimiento -- que el barrido recuerde
# entre corridas y no gaste cuota re-probando lo que ya se sabe.
#
# CAMPOS de un evento: ts, tipo (alta|baja|descartado|bloqueado), name/proveedor/
#   model, motivo, reintentable (true|false), reintentar_en (fecha) si aplica.
#
# REGLA DE REINTENTO (el motivo manda, no el gusto)
#   HTTP 404 / 410    -> muerto: el proveedor lo saco del catalogo.  reintentable: false
#   HTTP 401 / 403    -> acceso restringido o id privado/renombrado. reintentable: true (mes)
#   HTTP 429          -> saturado: puede volver solo.                reintentable: true (semana)
#   HTTP 402          -> exige saldo: no es gratis ni lo va a ser.   reintentable: false
#   HTTP 400 'terms'  -> falta aceptar terminos.                     reintentable: true (al aceptarlos)
#   Trampa de catalogo (se lista como gratis y no lo es)             reintentable: false
#   Bloqueado por credencial propia (key vencida / mal tipo)         reintentable: true (al renovar)
#
# OJO: 403 NO es muerte. Un 403 es "no me dejan todavia" (region, plan, acceso
# cerrado): se registra y se reintenta en la fecha. Lo definitivo es el 404/410
# y la trampa. Por eso modelos.yaml solo lleva en no_usar lo irrecuperable.
# ==================================================================

historico: 1
actualizado: 2026-09-15 11:35

resumen:
  vivos: 85
  altas: 85
  bajas: 0
  descartados: 9
  bloqueados: 2
  nota: >-
    Arranca el 15/09/26 con el relevamiento del universo no-chat de ese dia: 85
    gratuitos dados de alta (44 de pesos abiertos + 41 de free tier en 11
    proveedores). Lo que NO quedo en pie son 11 eventos: 5 trampas de catalogo
    (Lyria x2, Eleven Music, Suno v6, gpt-audio), 4 ids de HuggingFace que
    devolvieron 401 (6 ids contando los renombrados de demucs) y 2 bloqueos por
    puerta, no por modelo (1 detras de aceptacion de terminos, 6 modelos de
    Gemini con la credencial vencida).

