# Historico del catalogo de modelos del gateway LLM
# ==================================================================
# El registro que CRECE: cada alta, cada baja y cada descarte, con su motivo,
# su fecha y si puede volver. NO lo baja el gateway (para eso esta modelos.yaml):
# esto es para el mantenimiento del catalogo -- que el barrido recuerde entre
# corridas y no gaste cuota re-probando lo que ya se sabe.
#
# CAMPOS de un evento: ts, tipo (alta|baja|descartado), name/proveedor/model,
#   motivo, reintentable (true|false) y reintentar_en (fecha) si aplica.
# REGLA: `reintentable: true` = volver a probarlo en esa fecha, no antes.
#        un 429 (saturado) no es lo mismo que un 404 (no existe).
# ==================================================================

historico: 1
actualizado: 2026-09-15

resumen:
  vivos: 28
  bajas: 2
  descartados: 4
  nota: >-
    El historico arranca el 15/09/26 con lo que se sabe de las corridas previas.
    De aca en adelante, cada barrido agrega los eventos del dia.

eventos:
